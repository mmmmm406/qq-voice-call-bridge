services:
  napcat:
    # 从固定 QQ 基础镜像构建 AVSDK 运行依赖；NAPCAT_IMAGE 可替换基础镜像。
    image: qq-voice-call-napcat:local
    build:
      context: .
      args:
        NAPCAT_IMAGE: ${NAPCAT_IMAGE:-mlikiowa/napcat-docker@sha256:f611790ecffa23c3c182017d5cf68179dc24612403608cd835ad13d79642f1bd}
    init: true
    restart: "no"
    entrypoint: ["bash", "/opt/qq-voice-call-docker/entrypoint.sh"]
    environment:
      NAPCAT_UID: "1000"
      NAPCAT_GID: "1000"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:6099:6099"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - qq-data:/app/.config/QQ
      - napcat-config:/app/napcat/config
      - ../napcat-plugin:/opt/qq-voice-call:ro
      - ./entrypoint.sh:/opt/qq-voice-call-docker/entrypoint.sh:ro

volumes:
  qq-data:
  napcat-config:
