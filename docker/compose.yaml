services:
  napcat:
    # QQ 运行环境固定到镜像摘要；可通过 NAPCAT_IMAGE 使用自己的兼容镜像。
    image: ${NAPCAT_IMAGE:-mlikiowa/napcat-docker@sha256:f611790ecffa23c3c182017d5cf68179dc24612403608cd835ad13d79642f1bd}
    init: true
    restart: "no"
    entrypoint: ["bash", "/opt/qq-voice-call-docker/entrypoint.sh"]
    environment:
      NAPCAT_UID: "1000"
      NAPCAT_GID: "1000"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:6099:6099"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - qq-data:/app/.config/QQ
      - napcat-config:/app/napcat/config
      - ../napcat-plugin:/opt/qq-voice-call:ro
      - ./entrypoint.sh:/opt/qq-voice-call-docker/entrypoint.sh:ro

volumes:
  qq-data:
  napcat-config:
